services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pravaah
      POSTGRES_USER: pravaah
      POSTGRES_PASSWORD: pravaah
    ports:
      - "5432:5432"
    volumes:
      - pravaah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravaah -d pravaah"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://pravaah:pravaah@db:5432/pravaah
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET_KEY: local-development-only-change-this-secret-before-deployment
      DEMO_USER_PASSWORD: ChangeMe-LocalOnly-123!
      EVIDENCE_STORAGE_DIR: /data/uploads
      EVIDENCE_MAX_UPLOAD_BYTES: ${EVIDENCE_MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "8000:8000"
    volumes:
      - pravaah_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    restart: unless-stopped
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  notification-worker:
    restart: unless-stopped
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://pravaah:pravaah@db:5432/pravaah
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET_KEY: local-development-only-change-this-secret-before-deployment
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "scripts.notification_worker"]

volumes:
  pravaah_postgres_data:
  pravaah_uploads:
